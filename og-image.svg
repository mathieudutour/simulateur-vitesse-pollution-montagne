<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Vitesse, carburant et particules</title>
  <desc id="desc">Apercu du simulateur de conduite en route de montagne, avec carte, profil et resultats.</desc>
  <defs>
